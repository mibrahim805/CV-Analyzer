name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: apps/api}}
    services:
      postgres:
        image: postgres:16-alpine
        env: {POSTGRES_DB: career_test, POSTGRES_USER: career, POSTGRES_PASSWORD: career}
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U career -d career_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      APP_ENV: test
      APP_SECRET_KEY: ci-only-secret-at-least-thirty-two-characters
      DATABASE_URL: postgresql+asyncpg://career:career@localhost:5432/career_test
      DATABASE_URL_SYNC: postgresql+psycopg://career:career@localhost:5432/career_test
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip, cache-dependency-path: apps/api/pyproject.toml}
      - run: pip install -e '.[dev]'
      - run: alembic upgrade head
      - run: ruff check .
      - run: mypy app
      - run: pytest --cov=app --cov-report=term-missing
      - run: alembic downgrade base && alembic upgrade head

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: {version: 10.19.0}
      - uses: actions/setup-node@v4
        with: {node-version: "22", cache: pnpm}
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
