[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "career-pilot-api"
version = "0.1.0"
description = "CareerPilot API and background worker"
requires-python = ">=3.10"
dependencies = [
  "alembic>=1.14,<2",
  "argon2-cffi>=23.1,<26",
  "asyncpg>=0.30,<1",
  "boto3>=1.35,<2",
  "celery[redis]>=5.4,<6",
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "pydantic-settings>=2.7,<3",
  "email-validator>=2.2,<3",
  "psycopg[binary]>=3.2,<4",
  "pyjwt>=2.10,<3",
  "python-multipart>=0.0.18,<1",
  "pypdf>=5.1,<6",
  "python-docx>=1.1,<2",
  "redis>=5.2,<6",
  "sqlalchemy>=2.0.36,<3",
  "structlog>=24.4,<26",
  "uvicorn[standard]>=0.34,<1"
]

[project.optional-dependencies]
dev = [
  "aiosqlite>=0.20,<1",
  "mypy>=1.14,<2",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<1",
  "pytest-cov>=6,<7",
  "ruff>=0.9,<1"
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["B008", "S101"]

[tool.ruff.lint.per-file-ignores]
"alembic/versions/*.py" = ["E501"]
"app/core/config.py" = ["S105"]
"tests/*.py" = ["S105"]

[tool.mypy]
python_version = "3.10"
plugins = ["pydantic.mypy", "sqlalchemy.ext.mypy.plugin"]
strict = true

[[tool.mypy.overrides]]
module = ["boto3.*", "botocore.*", "celery.*", "redis.*"]
ignore_missing_imports = true
